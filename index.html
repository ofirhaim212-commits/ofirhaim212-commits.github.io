<script>
    // Configuration
    const API_KEY = "AQ.Ab8RN6KUHnTUMazExS0pLTr4yCGFV3vX_Fe8w8iYrFYO1KFngw"; 
    const API_URL = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;
    
    const SYSTEM_PROMPT = `You are an Expert AI Systems Engineering Consultant. Speak strict professional Hebrew. Guide engineers using the Hybrid Methodology. Recommend AI tools. Always state that the AI does the data processing while the engineer makes the strategic decisions.`;
    
    const INITIAL_MESSAGE = "שלום. אני יועץ בכיר להנדסת מערכות וניהול פרויקטים. כדי שנוכל להתקדם בצורה מדויקת: מהו השלב הנוכחי בפרויקט שאתה עובד עליו כעת? ומהו צוואר הבקבוק או המשימה המרכזית שאתה מתמודד איתה כרגע?";

    // State
    let isChatOpen = false;
    let chatHistory = [];
    let isWaitingForResponse = false;

    // DOM Elements
    const chatWindow = document.getElementById('chat-window');
    const chatToggleBtn = document.getElementById('chat-toggle-btn');
    const chatMessages = document.getElementById('chat-messages');
    const chatForm = document.getElementById('chat-form');
    const chatInput = document.getElementById('chat-input');
    const sendBtn = document.getElementById('send-btn');
    const typingIndicator = document.getElementById('typing-indicator');

    if(typeof marked !== 'undefined') {
        marked.setOptions({ breaks: true, gfm: true });
    }

    function initChat() {
        addMessageToUI('model', INITIAL_MESSAGE);
        chatHistory.push({ role: 'model', parts: [{ text: INITIAL_MESSAGE }] });
    }

    function toggleChat() {
        isChatOpen = !isChatOpen;
        if (isChatOpen) {
            chatWindow.classList.remove('hidden');
            setTimeout(() => {
                chatWindow.style.opacity = '1';
                chatWindow.style.transform = 'scale(1)';
                chatInput.focus();
            }, 10);
        } else {
            chatWindow.style.opacity = '0';
            chatWindow.style.transform = 'scale(0.95)';
            setTimeout(() => { chatWindow.classList.add('hidden'); }, 300);
        }
    }

    function addMessageToUI(role, text) {
        const messageDiv = document.createElement('div');
        messageDiv.classList.add('flex', 'w-full', 'mb-2');
        
        if (role === 'user') {
            messageDiv.classList.add('justify-end');
            messageDiv.innerHTML = `<div class="bg-cyan-600 text-white px-4 py-2 rounded-2xl rounded-bl-none max-w-[85%] text-sm shadow-md">${escapeHTML(text)}</div>`;
        } else {
            messageDiv.classList.add('justify-start');
            let formattedText = typeof marked !== 'undefined' ? marked.parse(text) : escapeHTML(text).replace(/\n/g, '<br>');
            messageDiv.innerHTML = `<div class="bg-slate-800 border border-slate-700 text-slate-200 px-4 py-3 rounded-2xl rounded-br-none max-w-[90%] text-sm shadow-md prose prose-invert prose-sm">${formattedText}</div>`;
        }
        
        chatMessages.appendChild(messageDiv);
        scrollToBottom();
    }

    function scrollToBottom() {
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function escapeHTML(str) {
        return str.replace(/[&<>'"]/g, tag => ({
            '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[tag] || tag));
    }

    function setTypingStatus(isTyping) {
        isWaitingForResponse = isTyping;
        if (isTyping) {
            typingIndicator.classList.remove('hidden');
            chatInput.disabled = true;
            sendBtn.disabled = true;
            sendBtn.classList.add('opacity-50');
        } else {
            typingIndicator.classList.add('hidden');
            chatInput.disabled = false;
            sendBtn.disabled = false;
            sendBtn.classList.remove('opacity-50');
            chatInput.focus();
        }
        scrollToBottom();
    }

    chatForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        if (isWaitingForResponse) return;

        const userText = chatInput.value.trim();
        if (!userText) return;

        chatInput.value = '';
        addMessageToUI('user', userText);
        chatHistory.push({ role: 'user', parts: [{ text: userText }] });
        setTypingStatus(true);

        try {
            const payload = {
                contents: chatHistory,
                systemInstruction: { parts: [{ text: SYSTEM_PROMPT }] }
            };

            const response = await fetch(API_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
            const result = await response.json();
            
            if (result.candidates && result.candidates.length > 0 && result.candidates[0].content) {
                const botResponse = result.candidates[0].content.parts[0].text;
                chatHistory.push({ role: 'model', parts: [{ text: botResponse }] });
                addMessageToUI('model', botResponse);
            } else {
                throw new Error("Invalid response structure");
            }
        } catch (error) {
            console.error("Chat API Error:", error);
            addMessageToUI('model', "שגיאה בתקשורת עם השרת. אנא נסה שוב מאוחר יותר.");
            chatHistory.pop();
        } finally {
            setTypingStatus(false);
        }
    });

    // ==========================================
    // קוד מעודכן לטופס יצירת הקשר ושליחה ל-Make
    // ==========================================
    document.getElementById('lead-form').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const submitBtn = document.getElementById('submit-lead');
        submitBtn.textContent = 'שולח...';
        submitBtn.disabled = true;

        const payload = {
            fullName: document.getElementById('fullName').value,
            email: document.getElementById('email').value,
            projectPhase: document.getElementById('projectPhase').value,
            challenge: document.getElementById('challenge').value,
            time: new Date().toLocaleString('he-IL')
        };

        const webhookUrl = "https://hook.eu1.make.com/jirw3roc9qqa1tif8kc2kzpc1vah4f6i";

        try {
            const response = await fetch(webhookUrl, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(payload)
            });

            if (response.ok) {
                document.getElementById('lead-form').reset();
                document.getElementById('form-success').classList.remove('hidden');
                setTimeout(() => {
                    document.getElementById('form-success').classList.add('hidden');
                }, 5000);
            } else {
                alert("שגיאה מול שרת Make (קוד: " + response.status + ").");
            }
        } catch (err) {
            console.error("Make Webhook Error:", err);
            alert("השליחה נחסמה! ודא שחוסם הפרסומות (AdBlock) שלך כבוי לאתר זה, ושמרת נכון את העדכון ב-GitHub.");
        } finally {
            submitBtn.textContent = 'שלח פנייה';
            submitBtn.disabled = false;
        }
    });

    window.addEventListener('DOMContentLoaded', initChat);
</script>
